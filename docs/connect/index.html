<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Finish connecting</title>
<!-- Generated by `oracle gmail connect-page`. Google redirects here after a team member allows The
     Oracle to read their mailbox. This page sends nothing anywhere: it only builds a WhatsApp link
     that carries the one-time code back to The Oracle, and the person taps Send themselves. The
     code is useless without The Oracle's client secret and PKCE verifier. -->
<style>
:root{--bg:#f5f6f8;--fg:#15181b;--muted:#5d6670;--card:#fff;--line:#e2e5e9;--go:#1d8a4b;--go-fg:#fff;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1113;--fg:#e7e9ec;--muted:#9aa3ad;--card:#161a1e;--line:#283036;--go:#2ea464;--go-fg:#04120a;--bad:#f97066}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1{font-size:20px;margin:0 0 8px}
p{margin:0 0 16px;color:var(--muted)}
a.go{display:block;text-align:center;background:var(--go);color:var(--go-fg);text-decoration:none;font-weight:600;
  padding:14px;border-radius:10px}
.bad{color:var(--bad)}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <section id="ok" hidden>
    <h1>Almost done</h1>
    <p>Tap the button, then tap <b>Send</b> in WhatsApp. The Oracle replies when your mailbox is connected.</p>
    <a class="go" id="go" href="#">Finish in WhatsApp</a>
  </section>
  <section id="err" hidden>
    <h1>Not connected</h1>
    <p id="why" class="bad"></p>
    <p>Send <b>/connect</b> to The Oracle on WhatsApp for a new link.</p>
  </section>
  <noscript><p>This page needs JavaScript to hand the sign-in code back to WhatsApp.</p></noscript>
</main>
<script>
(function () {
  var WA = "919632182411";
  var q = new URLSearchParams(location.search);
  var code = q.get("code") || "", state = q.get("state") || "", error = q.get("error");
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  function fail(msg) {
    document.getElementById("why").textContent = msg;
    document.getElementById("err").hidden = false;
  }
  if (error) {
    return fail(error === "access_denied" ? "You cancelled the Google sign-in, so nothing was connected."
                                          : "Google reported a problem: " + error.slice(0, 80));
  }
  if (!/^[A-Za-z0-9_-]{20,64}$/.test(state) || !/^[\x21-\x7e]{8,1024}$/.test(code)) {
    return fail("This page was opened without a valid sign-in code.");
  }
  document.getElementById("go").href =
    "https://wa.me/" + WA + "?text=" + encodeURIComponent("/connect " + state + " " + code);
  document.getElementById("ok").hidden = false;
})();
</script>
</body>
</html>
