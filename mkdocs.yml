site_name: Trinet Documentation
site_url: https://docs.panoculonlabs.com/
site_description: >-
  Official documentation for Trinet wearable cameras by Panoculon Labs — set up, record, sync
  cameras, use the Trinet app, update firmware, and build with the SDK and Python toolkit.
site_author: Panoculon Labs
copyright: >-
  &copy; 2026 Panoculon Labs Pvt. Ltd. ·
  <a href="https://www.panoculonlabs.com/privacy-policy">Privacy</a> ·
  <a href="https://www.panoculonlabs.com/terms-and-conditions">Terms</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      enable_creation_date: false

hooks:
  - hooks/llms.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.panoculonlabs.com/trinet
      name: Trinet on panoculonlabs.com
    - icon: fontawesome/brands/github
      link: https://github.com/Panoculon-Labs
      name: Panoculon Labs on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/panoculon-labs
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:innovate@panoculonlabs.com
      name: Email Panoculon Labs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /includes/*

nav:
