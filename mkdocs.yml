  - Products:
      - products/index.md
      - Trinet Mono: products/mono.md
      - Trinet Stereo: products/stereo.md
      - Trinet Stereo GS: products/stereo-gs.md
      - Trinet Wrist Kit: products/wrist-kit.md
      - Which camera do I have?: products/which-camera.md
  - Get started:
      - get-started/index.md
      - Record your first take: get-started/first-recording.md
      - LED indications: get-started/led-indications.md
      - Button: get-started/button.md
      - Microphone mute switch: get-started/mute-switch.md
      - Recording modes: get-started/modes.md
      - Use as a USB camera: get-started/usb-camera.md
      - Set up a Wrist Kit: get-started/wrist-kit-setup.md
      - Update the firmware: get-started/update-firmware.md
      - Files on the card: get-started/files-on-the-card.md
      - Mounting: get-started/mounting.md
  - Power & care:
      - power-and-care/index.md
      - Tested power banks: power-and-care/power-banks.md
      - Heat and thermal protection: power-and-care/thermal.md
      - Memory cards: power-and-care/memory-cards.md
      - Care and handling: power-and-care/care.md
  - Trinet app:
      - app/index.md
      - Record and review: app/record-and-review.md
      - Camera settings: app/camera-settings.md
      - Wireless status: app/wireless-status.md
  - Firmware:
      - firmware/index.md
      - Firmware release notes: firmware/release-notes.md
      - App & SDK release notes: firmware/app-sdk-release-notes.md
  - Your data:
      - data/index.md
      - Timing and sync: data/sync.md
      - File formats: data/file-formats.md
      - Sample data: data/sample-data.md
  - Python toolkit:
      - toolkit/index.md
      - Inspect and repair: toolkit/inspect-and-repair.md
      - Visualize and check sync: toolkit/visualize.md
      - Export to MCAP / ROS 2: toolkit/mcap.md
      - Put recordings on UTC: toolkit/wireless-utc.md
      - Ingest SD cards: toolkit/ingest.md
      - Stereo and 3D: toolkit/stereo-and-3d.md
  - Calibration:
      - calibration/index.md
      - Reference calibrations: calibration/reference-calibrations.md
      - Use a calibration: calibration/use-a-calibration.md
  - Build apps:
      - sdk/index.md
      - "Android: get started": sdk/android/getting-started.md
      - "Android: stream and preview": sdk/android/streaming.md
      - "Android: record and play back": sdk/android/recording.md
      - "Android: IMU data": sdk/android/imu.md
      - "Android: wireless status": sdk/android/wireless-status.md
      - "Android: API overview": sdk/android/api.md
      - iOS SDK: sdk/ios.md
      - USB transports: sdk/transports.md
  - Support:
      - support/index.md
      - Troubleshooting: support/troubleshooting.md
      - FAQ: support/faq.md
      - Warranty: support/warranty.md
      - Glossary: support/glossary.md
